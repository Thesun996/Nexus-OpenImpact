<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexus OpenImpact - 功能规划中</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-page="coming-soon">
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">N</div>
          <span>Nexus OpenImpact</span>
        </div>

        <div class="project-switcher">
          <button class="select-button" type="button" data-notice="项目切换会在接入上传历史后启用。">
            <span class="line-icon">▣</span>
            signature_change
            <span class="chevron">⌄</span>
          </button>
          <button class="select-button" type="button" data-notice="当前项目来自上传 ZIP，暂不支持分支切换。">
            <span class="line-icon">⑂</span>
            uploaded-zip
            <span class="chevron">⌄</span>
          </button>
        </div>

        <nav class="side-nav" aria-label="主导航">
          <a href="./index.html"><span>⌂</span>首页</a>
          <a href="./function-select.html"><span>‹›</span>变更分析</a>
          <a href="./analysis-report.html"><span>⌘</span>影响范围</a>
          <a data-module-link="callgraph" href="./coming-soon.html?module=callgraph"><span>⌬</span>调用关系</a>
          <a data-module-link="dependency" href="./coming-soon.html?module=dependency"><span>◇</span>依赖分析</a>
          <a data-module-link="history" href="./coming-soon.html?module=history"><span>◴</span>历史记录</a>
          <a data-module-link="settings" href="./coming-soon.html?module=settings"><span>⚙</span>配置管理</a>
        </nav>

        <div class="engine-card">
          <div class="engine-title"><span class="status-dot"></span>分析引擎 <b>运行正常</b></div>
          <ul>
            <li>Python 3.11.6</li>
            <li>AST 解析 <span>✓</span></li>
            <li>符号索引 <span>✓</span></li>
            <li>影响分析 <span>✓</span></li>
          </ul>
          <small>v0.1.0</small>
        </div>
      </aside>

      <section class="main-shell">
        <header class="topbar">
          <label class="global-search">
            <span>⌕</span>
            <input type="search" placeholder="搜索文件、函数、类或提交信息..." />
            <kbd>Ctrl</kbd><kbd>K</kbd>
          </label>
          <div class="top-actions">
            <a class="top-action-link" href="./coming-soon.html?module=docs">▤ 文档</a>
            <a class="top-action-link" href="./coming-soon.html?module=settings">⚙ 设置</a>
            <button class="language-toggle" type="button" data-language-toggle aria-label="Switch language">EN</button>
            <div class="user-chip">
              <div class="avatar default-avatar" aria-hidden="true"></div>
              <span>未命名用户</span>
              <span>⌄</span>
            </div>
          </div>
        </header>

        <main class="content workflow-content">
          <section class="page-heading">
            <div>
              <h1 data-coming-title>功能规划中</h1>
              <p data-coming-subtitle>当前第一版优先完成上传 ZIP、选择函数、配置变更和查看影响报告。</p>
            </div>
            <div class="heading-actions">
              <a class="ghost-action" href="./function-select.html">返回核心流程</a>
            </div>
          </section>

          <section class="detail-card empty-state-card">
            <div class="empty-state-icon" data-coming-icon>⌬</div>
            <h2 data-coming-card-title>这个模块暂未接入</h2>
            <p data-coming-copy>调用关系、依赖分析、历史记录和配置管理属于后续扩展。第一版不会展示空页面或虚假数据，核心能力集中在函数签名变更影响分析。</p>
            <div class="empty-state-actions">
              <a class="primary-action" href="./function-select.html">选择函数</a>
              <a class="ghost-action" href="./analysis-report.html">查看报告样例</a>
            </div>
          </section>
        </main>
      </section>
    </div>
    <script src="./app.js" defer></script>
  </body>
</html>
