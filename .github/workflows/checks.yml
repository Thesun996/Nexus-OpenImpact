name: Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONPATH: ${{ github.workspace }}/src
      OPENIMPACT_LLM_PROVIDER: rule
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -e ".[test]"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Backend tests
        env:
          OPENIMPACT_DB_PATH: ${{ runner.temp }}/openimpact-ci.sqlite3
          OPENIMPACT_SNAPSHOT_DIR: ${{ runner.temp }}/openimpact-ci-snapshots
        run: python -m pytest -q
      - name: Frontend tests and production build
        working-directory: frontend
        run: npm run check
      - name: Local environment preflight
        env:
          OPENIMPACT_DB_PATH: ${{ runner.temp }}/openimpact-ci.sqlite3
          OPENIMPACT_SNAPSHOT_DIR: ${{ runner.temp }}/openimpact-ci-snapshots
        run: python scripts/run_local.py --provider rule --check
      - name: Start API, Worker and Vite, verify proxy, then stop
        env:
          OPENIMPACT_DB_PATH: ${{ runner.temp }}/openimpact-ci.sqlite3
          OPENIMPACT_SNAPSHOT_DIR: ${{ runner.temp }}/openimpact-ci-snapshots
        run: python scripts/run_local.py --provider rule --smoke-test
      - name: Whitespace check for the integrated change
        run: git diff --check HEAD^ HEAD
